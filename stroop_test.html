<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroop Test</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <script src="navbar.js"></script>

    <h1>Stroop Test</h1>
    <div style="width: 100%; height: 100px; position: relative; margin-top: 20px;">
        <img id="progress-character" src="triton.PNG" alt="Moving dude" 
            style="position: absolute; left: 0; height: 80px; transition: left 1s ease; bottom: 0; ">

        <img src="finish_line.PNG" alt="Finish_line" 
            style="position: absolute; right: 0; height: 60px; bottom: 0; ">

    </div>
    <div class="stroop-flex">
        <div id="stroop-word-container">
            <h2 id="stroop-word">LOADING...</h2>
        </div>
        <p>Press the key on your keyboard corresponding to the color of the word:</p>
            <ul>
                <li>R - Red</li>
                <li>G - Green</li>
                <li>B - Blue</li>
                <li>Y - Yellow</li>
            </ul>
        
        <p id="feedback"></p>
        <button id="plot-btn" onclick="window.location.href='plot.html'">Go to Plot</button>
        
    </div>

    <script src="stroop.js"></script>
</body>

</html>
